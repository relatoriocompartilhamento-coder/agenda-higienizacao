name: Aviso de ações no Telegram

on:
  schedule:
    - cron: "0 13 * * *"   # todo dia às 10h (horário de Brasília)
  workflow_dispatch:
    inputs:
      modo:
        description: "proxima = teste (envia a próxima ação agora) / vespera = aviso normal"
        type: choice
        options: [proxima, vespera]
        default: proxima

jobs:
  aviso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verificar agenda e enviar aviso
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODO: ${{ inputs.modo || 'vespera' }}
        run: python avisar.py
